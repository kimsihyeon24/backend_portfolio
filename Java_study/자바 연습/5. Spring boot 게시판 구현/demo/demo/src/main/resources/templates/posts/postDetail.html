<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세 보기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .comment-section { background-color: #f8f9fa; border-radius: 10px; padding: 20px; }
        .comment-item { border-bottom: 1px solid #dee2e6; padding: 10px 0; }
        .comment-item:last-child { border-bottom: none; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 800px;">
    <div class="card shadow border-0 mb-4">
        <div class="card-header bg-white py-3">
            <h2 class="mb-0" th:text="${post.title}">제목</h2>
            <small class="text-muted">작성자: <span th:text="${post.author}"></span></small>
        </div>
        <div class="card-body p-4" style="min-height: 200px;">
            <p class="lead" th:text="${post.content}" style="white-space: pre-wrap;">내용</p>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between py-3">
            <a href="/posts" class="btn btn-outline-secondary">목록으로</a>
            <div>
                <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-warning text-white">수정하기</a>
                <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('지울까요?')">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <div class="comment-section shadow-sm mb-5">
        <h4>댓글 <span class="badge bg-primary" th:text="${comments.size()}">0</span></h4>
        <hr>

        <div th:if="${not #lists.isEmpty(comments)}">
            <div th:each="comment : ${comments}" class="comment-item">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong th:text="${comment.writer}">작성자</strong>
                        <small class="text-muted ms-2" th:text="${#temporals.format(comment.createdAt, 'MM-dd HH:mm')}"></small>
                    </div>

                    <form th:action="@{/posts/{postId}/comments/{commentId}/delete(postId=${post.id}, commentId=${comment.id})}"
                          method="post" style="display:inline;">
                        <button type="submit" class="btn btn-sm text-danger"
                                onclick="return confirm('이 댓글을 삭제하시겠습니까?')">삭제</button>
                    </form>
                </div>
                <p class="mt-2 mb-1" th:text="${comment.content}">댓글 내용</p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(comments)}" class="text-center py-4 text-muted">
            아직 댓글이 없습니다. 첫 댓글을 남겨보세요!
        </div>

        <hr> <div class="mt-4">
        <h5 class="mb-3">댓글 남기기</h5>
        <form th:action="@{/posts/{postId}/comments(postId=${post.id})}" method="post">
            <div class="mb-3">
                <input type="text" name="writer" class="form-control form-control-sm w-25" placeholder="작성자 이름" required>
            </div>
            <div class="mb-3">
                <textarea name="content" class="form-control" rows="3" placeholder="내용을 입력하세요" required></textarea>
            </div>
            <div class="text-end">
                <button type="submit" class="btn btn-primary">댓글 등록</button>
            </div>
        </form>
    </div>
    </div>
</div>
</body>
</html>
